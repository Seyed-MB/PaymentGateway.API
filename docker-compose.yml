services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: paymentgateway-sql
    environment:
      SA_PASSWORD: "YourPassword123"
      ACCEPT_EULA: "Y"
    ports:
      - "1434:1433"
    networks:
      - paymentgateway-net
    restart: unless-stopped

  api:
    build:
      context: .           # Dockerfile همین جاست
      dockerfile: Dockerfile
    container_name: paymentgateway-api
    ports:
      - "8080:80"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=PaymentGatewayDockerDb;User Id=sa;Password=YourPassword123;TrustServerCertificate=True"
    depends_on:
      - sqlserver
    networks:
      - paymentgateway-net
    restart: unless-stopped

networks:
  paymentgateway-net:
    driver: bridge
