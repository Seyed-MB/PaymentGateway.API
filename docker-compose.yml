version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: paymentgateway-sql
    environment:
      SA_PASSWORD: "YourPassword123"
      ACCEPT_EULA: "Y"
    ports:
      - "1434:1433"  # پورت متفاوت روی میزبان
    networks:
      - paymentgateway-net
    restart: unless-stopped

  api:
    image: paymentgateway.api
    container_name: paymentgateway-api
    build:
      context: .
      dockerfile: PaymentGateway.API/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # دیتابیس با نام متفاوت
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=PaymentGatewayDockerDb;User Id=sa;Password=YourPassword123;TrustServerCertificate=True"
    depends_on:
      - sqlserver
    networks:
      - paymentgateway-net
    restart: unless-stopped

networks:
  paymentgateway-net:
    driver: bridge
