name: .NET CI with Docker Compose (Auto Build & Run)

on:
  push:
    branches:
      - master
      - featuer/*

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore PaymentGateway.API.csproj

      - name: Build project
        run: dotnet build PaymentGateway.API.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test PaymentGateway.Application.Tests.csproj --no-build --verbosity normal

      - name: Publish project
        run: dotnet publish PaymentGateway.API.csproj -c Release -o ./publish

      - name: Docker Compose Build & Up
        run: |
          docker-compose down
          docker-compose up -d --build

      - name: Wait for API to start
        run: |
          retries=10
          until curl -f http://localhost:8080/swagger || [ $retries -eq 0 ]; do
            echo "Waiting for API..."
            sleep 5
            ((retries--))
          done
