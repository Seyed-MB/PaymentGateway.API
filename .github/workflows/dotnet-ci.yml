name: .NET CI with Docker (Auto Build & Run)

on:
  push:
    branches:
      - main
      - feature/*

jobs:
  build-test-docker:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore PaymentGateway.API/PaymentGateway.API.csproj

      - name: Build project
        run: dotnet build PaymentGateway.API/PaymentGateway.API.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test PaymentGateway.Application.Tests/PaymentGateway.Application.Tests.csproj --no-build --verbosity normal

      - name: Publish project
        run: dotnet publish PaymentGateway.API/PaymentGateway.API.csproj -c Release -o ./publish

      - name: Build Docker image
        run: docker build -t paymentgateway.api:latest .

      - name: Cleanup previous container
        run: |
          if [ $(docker ps -aq -f name=paymentgateway-api) ]; then
            docker rm -f paymentgateway-api
          fi

      - name: Run Docker container
        run: docker run -d -p 8080:80 --name paymentgateway-api paymentgateway.api:latest

      - name: Wait for API to start
        run: |
          retries=10
          until curl -f http://localhost:8080/swagger || [ $retries -eq 0 ]; do
            echo "Waiting for API..."
            sleep 5
            ((retries--))
          done
