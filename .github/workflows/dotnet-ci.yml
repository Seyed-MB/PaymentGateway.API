name: .NET CI with Docker Compose (Auto Build & Run)

on:
  push:
    branches:
      - master
      - featuer/*

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      # 1️⃣ دریافت سورس
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ استفاده از .NET نصب شده روی runner
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
          use-global-dotnet: true

      # 3️⃣ Restore
      - name: Restore dependencies
        run: dotnet restore PaymentGateway.API/PaymentGateway.API.csproj

      # 4️⃣ Build
      - name: Build project
        run: dotnet build PaymentGateway.API/PaymentGateway.API.csproj --configuration Release --no-restore

      # 5️⃣ Unit tests
      - name: Run unit tests
        run: dotnet test PaymentGateway.Tests/PaymentGateway.Tests.csproj --no-build --verbosity normal

      # 6️⃣ Publish
      - name: Publish project
        run: dotnet publish PaymentGateway.API/PaymentGateway.API.csproj -c Release -o ./publish

      # 7️⃣ Docker Compose Build & Up
      - name: Docker Compose Build & Up
        run: |
          docker-compose down
          docker-compose up -d --build

      # 8️⃣ Wait for API to start
      - name: Wait for API to start
        run: |
          retries=10
          until curl -f http://localhost:8080/swagger || [ $retries -eq 0 ]; do
            echo "Waiting for API..."
            sleep 5
            ((retries--))
          done
