name: .NET CI with Docker (Local Registry)

on:
  push:
    branches:
      - main
      - feature/*

jobs:
  build-test-docker:
    # اجرای workflow روی self-hosted runner
    runs-on: self-hosted

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
          - 1434:1433
        env:
          SA_PASSWORD: "YourPassword123"
          ACCEPT_EULA: "Y"
        options: >-
          --health-cmd "exit 0"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore PaymentGateway.API/PaymentGateway.API.csproj

      - name: Build project
        run: dotnet build PaymentGateway.API/PaymentGateway.API.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test PaymentGateway.Application.Tests/PaymentGateway.Application.Tests.csproj --no-build --verbosity normal

      - name: Publish project
        run: dotnet publish PaymentGateway.API/PaymentGateway.API.csproj -c Release -o ./publish

      - name: Build Docker image
        run: docker build -t paymentgateway.api .

      - name: Cleanup previous container
        run: docker rm -f paymentgateway-api || true

      - name: Tag Docker image for local registry
        run: docker tag paymentgateway.api localhost:5000/paymentgateway.api:latest

      - name: Push Docker image to local registry
        run: docker push localhost:5000/paymentgateway.api:latest

      - name: Run Docker container
        run: docker run -d -p 8080:80 --name paymentgateway-api localhost:5000/paymentgateway.api:latest

      - name: Wait for API
        run: sleep 15

      - name: Test API availability
        run: curl -f http://localhost:8080/swagger
