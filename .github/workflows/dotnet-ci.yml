name: .NET CI with Docker Compose (Auto Build & Run)

on:
  push:
    branches:
      - master
      - featuer/*

jobs:
  build-and-deploy:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: ./PaymentGateway.API/PaymentGateway.API

    steps:
      # 1️⃣ دریافت سورس
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ تنظیم .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
          use-global-dotnet: true

      # 3️⃣ Restore
      - name: Restore dependencies
        run: dotnet restore PaymentGateway.API.csproj

      # 4️⃣ Build
      - name: Build project
        run: dotnet build PaymentGateway.API.csproj --configuration Release --no-restore

      # 5️⃣ Unit tests (اختیاری: فقط اگر مسیر تست‌ها درست باشه)
      # - name: Run unit tests
      #   run: dotnet test ../../PaymentGateway.Tests/PaymentGateway.Tests.csproj --no-build --verbosity normal

      # 6️⃣ Publish
      - name: Publish project
        run: dotnet publish PaymentGateway.API.csproj -c Release -o ./publish

      # 7️⃣ Docker Compose Build & Up
      - name: Docker Compose Build & Up
        run: |
          docker-compose down
          docker-compose up -d --build
